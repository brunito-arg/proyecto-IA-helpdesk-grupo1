services:
  mysql:
    image: mysql:8
    container_name: helpdesk-mysql
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-loquesea2008}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-loquesea2008}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: helpdesk-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/helpdesk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-loquesea2008}
      APP_JWT_SECRET: ${JWT_SECRET:-UnaClaveSecretaMuyLargaYSeguraParaElHelpdeskConJWTSuperSegura2024}
      APP_UPLOAD_DIR: /app/uploads
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  asistente:
    build: ./server
    container_name: helpdesk-asistente
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      KB_DIR: /app/kb
    volumes:
      - ./kb:/app/kb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8080
      VITE_ASSISTANT_TARGET: http://asistente:8000
    ports:
      - "80:5173"
      - "5173:5173"
    depends_on:
      - backend
      - asistente

volumes:
  mysql-data:
